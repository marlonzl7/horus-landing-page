          - paragraph [ref=f119e84]: Ninguém precisa abrir o app. Ele compartilha a posição sozinho, e quem consulta vê tudo no mapa.
        - listitem [ref=f119e85]:
          - heading "Privacidade e LGPD" [level=3] [ref=f119e90]
          - paragraph [ref=f119e91]: Localização é dado sensível. O app pede consentimento explícito e só mostra a posição para quem é da sua família.
        - listitem [ref=f119e92]:
          - heading "Um plano para a família toda" [level=3] [ref=f119e99]
          - paragraph [ref=f119e100]: O preço é por família, não por pessoa. Pai, mãe e filhos entram juntos, sem conta extra.
        - listitem [ref=f119e101]:
          - heading "Convite em um toque" [level=3] [ref=f119e106]
          - paragraph [ref=f119e107]: O administrador convida cada familiar por e-mail. Quem recebe aceita pelo app e já aparece no mapa.
        - listitem [ref=f119e108]:
          - heading "Feito para o Brasil" [level=3] [ref=f119e112]
          - paragraph [ref=f119e113]: Interface em português, pensada para famílias brasileiras, sem a complexidade dos apps gringos.
